<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="js/script.js"></script>
  


</head>
<body>
    <form>
        <div class="card-header bg-light border-bottom p-3">			
            <h3 class="m-0">Payment form example</h3>
        </div>
        <div class="form-body">
            <div class="alert alert-danger" role="alert">
            Some fields are missing
            </div>
            <div class="form-inputs">
                <div class="row g-3 mt-2">
                <div class="col-5">
                    <label for="AccoountNumber">Card #</label>
                    <input type="text" id="AccountNumber" class="form-control" placeholder="XXXXXXXXXXXXXXXX" />
                </div>
                <div class="col-3">
					<label for="CVC">CVC #</label> 
					<input type="text" id="CVC" class="form-control"  placeholder="0000">
				</div>
                <div class="col-4">
					<label for="Amount">Amount</label>
                    <div class="sign">
                        <input type="number" id="Amount" class="form-control" placeholder="Amount" >
                    </div>
					
				</div>
                <div class="row">
                    <div class="col-6">
                        <label for="Name">First Name</label> 
						<input type="text" id="Name" class="form-control" >
                    </div>
                    <div class="col-6">
                        <label for="LastName">Last Name</label> 
						<input type="text" id="LastName" class="form-control" >
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="City">City</label> 
						<input type="text" id="City" class="form-control">
                    </div>
                    <div class="col-3">
                        <label for="State">State</label> 
                        <select class="form-select" id="States">
                        <option selected disabled>
							Pick a state
						</option>
						<option value="AL">
							Alabama
						</option>

							Alaska
						</option>
						<option value="AZ">

						</option>

						</option>
						<option value="CA">
							California
						</option>
						<option value="CO">
							Colorado
						</option>
						<option value="CT">
							Connecticut
						</option>
						<option value="DE">
							Delaware
						</option>
						<option value="DC">
							District Of Columbia
						</option>
						<option value="FL">
							Florida
						</option>
						<option value="GA">
							Georgia
						</option>
						<option value="HI">
							Hawaii
						</option>
						<option value="ID">
							Idaho
						</option>
						<option value="IL">
							Illinois
						</option>
						<option value="IN">
							Indiana
						</option>
						<option value="IA">
							Iowa
						</option>
						<option value="KS">
							Kansas
						</option>
						<option value="KY">
							Kentucky
						</option>
						<option value="LA">
							Louisiana
						</option>
						<option value="ME">
							Maine
						</option>
						<option value="MD">
							Maryland
						</option>
						<option value="MA">
							Massachusetts
						</option>
						<option value="MI">
							Michigan
						</option>
						<option value="MN">
							Minnesota
						</option>
						<option value="MS">
							Mississippi
						</option>
						<option value="MO">
							Missouri
						</option>
						<option value="MT">
							Montana
						</option>
						<option value="NE">
							Nebraska
						</option>
						<option value="NV">
							Nevada
						</option>
						<option value="NH">
							New Hampshire
						</option>
						<option value="NJ">
							New Jersey
						</option>
						<option value="NM">
							New Mexico
						</option>
						<option value="NY">
							New York
						</option>
						<option value="NC">
							North Carolina
						</option>
						<option value="ND">
							North Dakota
						</option>
						<option value="OH">
							Ohio

						<option value="OK">
							Oklahoma

						<option value="OR">
							Oregon
						</option>
						<option value="PA">
							Pennsylvania
						</option>
						<option value="RI">
							Rhode Island
						</option>
						<option value="SC">
							South Carolina

						<option value="SD">

						</option>
						<option value="WY">
							Wyoming
						</option>
						</select>
                    </div>
                    <div class="col-3">
                        <label for="Postal">Postal Code</label> 
						<input type="number" id="Postal" class="form-control">                       
                    </div>

                </div>
                <div class="row">
                    <div class="col-6">
						<label class="form-label d-block">We accept:</label>
                        <div class="p-2 bg-secondary text-white rounded d-inline-block"> <input id="M" name="Cards" type="radio" checked> <i class="fab fa-cc-mastercard me-2"></i>
                        <input id="V" name="Cards" type="radio"> <i class="fab fa-cc-visa me-2"></i>
                        <input id="D" name="Cards" type="radio"> <i class="fab fa-cc-diners-club me-2"></i>
                        <input id="A" name="Cards" type="radio"> <i class="fab fa-cc-amex"></i>

                    </div>
                    <div class="col-6">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="complexExampleMessage" rows="3"></textarea>                          
						<small class="text-muted">Add any notes here.</small>
                    </div>
                </div>

            </div>
           
                 
            </div>

        </div>

        </div>
		<div class="card-footer bg-light p-3"> <div class="d-flex justify-content-end gap-2"> <button class="btn btn-secondary" type="reset">Cancel</button> 
			<button id="sendForm" class="btn btn-primary" type="button">Send</button>
		</div>     
   
    </div>
    
    </form>
    





<script  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
